<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AMS Ultra Pro</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

/* ===== THEME ===== */
:root{
  --bg:#0b1220;
  --card:#111a2e;
  --accent:#6366f1;
  --accent2:#9333ea;
  --text:#e2e8f0;
}

body{
  margin:0;
  font-family:Segoe UI;
  background:var(--bg);
  color:var(--text);
}

/* ===== AUTH ===== */
.center{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.box{
  background:var(--card);
  padding:25px;
  border-radius:15px;
  width:300px;
  animation:fade .5s;
}

input{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:none;
  border-radius:8px;
}

button{
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  background:linear-gradient(45deg,var(--accent),var(--accent2));
  color:white;
  cursor:pointer;
}

/* ===== APP ===== */
.app{ display:none; }

.sidebar{
  width:230px;
  height:100vh;
  position:fixed;
  background:var(--card);
  padding:20px;
}

.sidebar li{
  list-style:none;
  margin:12px 0;
  cursor:pointer;
}

.main{
  margin-left:240px;
  padding:20px;
}

/* ===== CARDS ===== */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:20px;
}

.card{
  background:var(--card);
  padding:15px;
  border-radius:12px;
  transition:.3s;
}

.card:hover{
  transform:translateY(-5px);
}

/* ===== GALLERY ===== */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
}

.img-card{
  background:var(--card);
  border-radius:12px;
  overflow:hidden;
}

.img-card img{
  width:100%;
  height:140px;
  object-fit:cover;
}

/* ===== FOOTER ===== */
footer{
  margin-top:30px;
  text-align:center;
  padding:20px;
  background:#060b16;
}

/* ===== TOAST ===== */
#toast{
  position:fixed;
  bottom:20px;
  right:20px;
  background:var(--accent);
  padding:10px;
  border-radius:8px;
  display:none;
}

/* ===== ANIMATION ===== */
@keyframes fade{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

</style>
</head>

<body>

<!-- LOGIN -->
<div class="center" id="loginBox">
  <div class="box">
    <h2>Login</h2>
    <input id="luser" placeholder="Username">
    <input id="lpass" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p onclick="showRegister()">Register</p>
  </div>
</div>

<!-- REGISTER -->
<div class="center" id="registerBox" style="display:none">
  <div class="box">
    <h2>Register</h2>
    <input id="ruser" placeholder="Username">
    <input id="rpass" type="password">
    <button onclick="register()">Create</button>
    <p onclick="showLogin()">Back</p>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">

<div class="sidebar">
  <h2>🌾 AMS</h2>
  <li onclick="show('dash')"><i class="fa fa-chart-pie"></i> Dashboard</li>
  <li onclick="show('farm')"><i class="fa fa-users"></i> Farmers</li>
  <li onclick="show('gallery')"><i class="fa fa-image"></i> Gallery</li>
  <li onclick="logout()"><i class="fa fa-sign-out"></i> Logout</li>
</div>

<div class="main">

<!-- DASHBOARD -->
<div id="dash">
  <h1>Dashboard</h1>

  <div class="cards">
    <div class="card">Farmers <h2 id="fcount">0</h2></div>
    <div class="card">Crops <h2 id="ccount">0</h2></div>
  </div>

  <canvas id="pie"></canvas>
</div>

<!-- FARMERS -->
<div id="farm" style="display:none">
  <h1>Farmers</h1>
  <input id="fname" placeholder="Name">
  <button onclick="addFarmer()">Add</button>
  <ul id="list"></ul>
</div>

<!-- GALLERY -->
<div id="gallery" style="display:none">
  <h1>Gallery</h1>

  <div class="grid">
    <div class="img-card">
      <img src="https://images.unsplash.com/photo-1500937386664-56d1dfef3854">
    </div>
    <div class="img-card">
      <img src="https://images.unsplash.com/photo-1471193945509-9ad0617afabf">
    </div>
  </div>
</div>

<footer>
  © 2026 AMS ™ | Privacy | About | Terms
</footer>

</div>
</div>

<div id="toast"></div>

<script>

/* ===== AUTH SYSTEM ===== */
function register(){
  let u=document.getElementById("ruser").value;
  let p=document.getElementById("rpass").value;

  let users=JSON.parse(localStorage.getItem("users"))||[];
  users.push({u,p});
  localStorage.setItem("users",JSON.stringify(users));

  showLogin();
}

function login(){
  let u=document.getElementById("luser").value;
  let p=document.getElementById("lpass").value;

  let users=JSON.parse(localStorage.getItem("users"))||[];
  let ok=users.find(x=>x.u==u && x.p==p);

  if(ok){
    localStorage.setItem("session",u);
    start();
  }else alert("Wrong login");
}

function start(){
  loginBox.style.display="none";
  registerBox.style.display="none";
  app.style.display="block";
}

/* ===== NAV ===== */
function show(p){
  dash.style.display="none";
  farm.style.display="none";
  gallery.style.display="none";
  document.getElementById(p).style.display="block";
}

/* ===== FARMERS ===== */
let farmers=JSON.parse(localStorage.getItem("farmers"))||[];

function addFarmer(){
  let f=document.getElementById("fname").value;
  farmers.push(f);
  localStorage.setItem("farmers",JSON.stringify(farmers));
  render();
  toast("Added");
}

function render(){
  document.getElementById("fcount").innerText=farmers.length;
  document.getElementById("ccount").innerText=3;

  list.innerHTML=farmers.map(f=>`<li>${f}</li>`).join("");

  new Chart(pie,{
    type:"pie",
    data:{
      labels:["Farmers","Crops"],
      datasets:[{data:[farmers.length,3]}]
    }
  });
}

/* ===== UI ===== */
function showRegister(){
  loginBox.style.display="none";
  registerBox.style.display="flex";
}

function showLogin(){
  registerBox.style.display="none";
  loginBox.style.display="flex";
}

function logout(){
  localStorage.removeItem("session");
  location.reload();
}

/* ===== TOAST ===== */
function toast(m){
  let t=document.getElementById("toast");
  t.innerText=m;
  t.style.display="block";
  setTimeout(()=>t.style.display="none",2000);
}

/* AUTO START */
if(localStorage.getItem("session")) start();

render();

</script>

</body>
    </html>
